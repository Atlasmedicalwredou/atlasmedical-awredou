
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Médical — Exploration du cœur</title>

  <script src="./meshopt_decoder.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #123653;
      background: #edf7fb;
    }

    header {
      padding: 18px;
      text-align: center;
    }

    h1 { margin: 0 0 8px; font-size: 22px; }

    #viewer {
      position: relative;
      width: 100%;
      height: 72vh;
      min-height: 420px;
      overflow: hidden;
      background: radial-gradient(circle, #fff, #d9f0f7);
    }

    #viewer canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #info {
      margin: 16px;
      padding: 18px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 18px #12365312;
    }

    #structureName {
      color: #087f91;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    #status {
      font-size: 13px;
      color: #527184;
    }
  </style>
</head>

<body>

<header>
  <h1>Atlas Médical — Cœur anatomique</h1>
  <p>Exploration et sélection des structures</p>
</header>

<div id="viewer"></div>

<section id="info">
  <div id="structureName">Chargement du cœur...</div>
  <div id="status">Préparation du modèle anatomique</div>
</section>

<script type="module">
  import * as THREE from
    'https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js';

  import { OrbitControls } from
    'https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/controls/OrbitControls.js';

  import { GLTFLoader } from
    'https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/loaders/GLTFLoader.js';

  const viewer = document.getElementById("viewer");
  const nameDisplay = document.getElementById("structureName");
  const statusDisplay = document.getElementById("status");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe5f5fa);

  const camera = new THREE.PerspectiveCamera(
    40,
    viewer.clientWidth / viewer.clientHeight,
    0.001,
    100
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  viewer.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x7895a5, 2));

  const light = new THREE.DirectionalLight(0xffffff, 3);
  light.position.set(2, 3, 4);
  scene.add(light);

  const secondLight = new THREE.DirectionalLight(0xffffff, 1.5);
  secondLight.position.set(-3, -2, -4);
  scene.add(secondLight);

  const loader = new GLTFLoader();

  const meshopt = window.MeshoptDecoder;

  if (!meshopt) {
    throw new Error("Décodeur Meshopt introuvable.");
  }

  loader.setMeshoptDecoder(meshopt);

  let selectedObject = null;
  let originalMaterials = null;

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();

  loader.load(
    "./models/heart-advanced-structured.glb",

    (gltf) => {
      const heart = gltf.scene;
      scene.add(heart);

      const bounds = new THREE.Box3().setFromObject(heart);
      const center = bounds.getCenter(new THREE.Vector3());
      const size = bounds.getSize(new THREE.Vector3());
      const maxSize = Math.max(size.x, size.y, size.z);

      controls.target.copy(center);

      camera.position.set(
        center.x,
        center.y,
        center.z + maxSize * 2.5
      );

      camera.near = maxSize / 1000;
      camera.far = maxSize * 100;
      camera.updateProjectionMatrix();

      controls.update();

      let meshCount = 0;

      heart.traverse((object) => {
        if (object.isMesh) {
          meshCount++;
        }
      });

      nameDisplay.textContent = "Cœur chargé !";
      statusDisplay.textContent =
        meshCount + " maillages détectés. Touche une structure pour l'identifier.";

    },

    (progress) => {
      if (progress.total > 0) {
        const percent = Math.round(
          progress.loaded / progress.total * 100
        );

        statusDisplay.textContent =
          "Chargement : " + percent + "%";
      }
    },

    (error) => {
      console.error(error);
      nameDisplay.textContent = "Erreur de chargement";
      statusDisplay.textContent =
        "Vérifie le fichier GLB et le décodeur Meshopt.";
    }
  );

  function restoreSelection() {
    if (!selectedObject || !originalMaterials) return;

    selectedObject.material = originalMaterials;
    selectedObject = null;
    originalMaterials = null;
  }

  function selectStructure(object) {
    restoreSelection();

    selectedObject = object;

    originalMaterials = object.material;

    if (Array.isArray(object.material)) {
      object.material = object.material.map((material) => {
        const copy = material.clone();

        if (copy.emissive) {
          copy.emissive.set(0x00c9bd);
          copy.emissiveIntensity = 0.8;
        }

        return copy;
      });
    } else {
      object.material = object.material.clone();

      if (object.material.emissive) {
        object.material.emissive.set(0x00c9bd);
        object.material.emissiveIntensity = 0.8;
      }
    }

    nameDisplay.textContent =
      object.name || "Structure anatomique";

    statusDisplay.textContent =
      "Structure sélectionnée et mise en évidence.";
  }

  let pointerStart = null;

  renderer.domElement.addEventListener("pointerdown", (event) => {
    pointerStart = {
      x: event.clientX,
      y: event.clientY
    };
  });

  renderer.domElement.addEventListener("pointerup", (event) => {
    if (!pointerStart) return;

    const distance = Math.hypot(
      event.clientX - pointerStart.x,
      event.clientY - pointerStart.y
    );

    pointerStart = null;

    if (distance > 6) return;

    const rect = renderer.domElement.getBoundingClientRect();

    pointer.x =
      ((event.clientX - rect.left) / rect.width) * 2 - 1;

    pointer.y =
      -((event.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointer, camera);

    const intersections = raycaster.intersectObjects(
      scene.children,
      true
    );

    const hit = intersections.find(
      (item) => item.object.isMesh
    );

    if (hit) {
      selectStructure(hit.object);
    }
  });

  window.addEventListener("resize", () => {
    camera.aspect = viewer.clientWidth / viewer.clientHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>

</body>
</html>
